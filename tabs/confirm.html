<!-- tab: confirm -->
<style>
.q-list { margin: 0; padding: 0; }
.q-item {
  margin-bottom: 18px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border-soft);
}
.q-item:last-child { border-bottom: none; padding-bottom: 0; }
.q-question {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  letter-spacing: -0.005em;
}
.q-question .req { color: var(--err); margin-left: 4px; font-weight: 400; }
.q-context {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 10px;
  line-height: 1.55;
}
.q-input { margin-top: 8px; }
.q-input input[type="text"],
.q-input textarea,
.q-input select {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.q-input input[type="text"]:focus,
.q-input textarea:focus,
.q-input select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.q-input textarea { min-height: 80px; resize: vertical; }
.q-input label.opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  margin: 3px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  transition: background 0.12s, border-color 0.12s;
}
.q-input label.opt:hover {
  background: var(--bg-elev);
  border-color: var(--text-muted);
}
.q-input label.opt input {
  margin: 0;
  accent-color: var(--accent);
}
.q-answered {
  background: var(--ok-soft);
  border: 1px solid transparent;
  border-left: 2px solid var(--ok);
  padding: 8px 12px;
  border-radius: var(--radius);
  margin-top: 6px;
}
.q-answered .label {
  color: var(--ok);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 2px;
  font-family: var(--font-mono);
}
.q-answered .value {
  font-size: 13px;
  color: var(--text);
}
.q-answered .answered-actions {
  margin-top: 6px;
}
.q-answered .answered-actions button { font-size: 11px; padding: 2px 6px; }
.confirm-empty {
  padding: 32px 0;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
.confirm-actions {
  display: flex; gap: 10px; align-items: center;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
}
.confirm-actions .muted { font-size: 12px; }
</style>

<section data-tab-id="{{TAB_ID}}" data-tab-type="confirm" id="panel-{{TAB_ID}}">

  <div class="block">
    <h2 class="block-title">需要你确认的问题</h2>
    <div class="block-body">
      <form id="confirm-form-{{TAB_ID}}" data-confirm-form>
        <div class="q-list">{{OPEN_QUESTIONS}}</div>
        <div class="confirm-actions">
          <button type="submit" class="primary">保存答案草稿</button>
          <span class="muted">先保存草稿，再点顶部“本轮提交”交给 AI</span>
        </div>
      </form>
    </div>
  </div>

</section>

<script>
window.__TAB_INITS__ = window.__TAB_INITS__ || [];
window.__TAB_INITS__.push(function initConfirm() {
  const form = document.getElementById('confirm-form-{{TAB_ID}}');
  if (!form) return;

  const questions = window.__STATE__.open_questions || [];
  const readAnswer = node => {
    const type = node.dataset.qtype;
    if (!node.querySelector('.q-input')) return undefined;
    if (type === 'radio') return node.querySelector('input[type=radio]:checked')?.value;
    if (type === 'checkbox') return Array.from(node.querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
    return node.querySelector('select, textarea, input[type=text]')?.value;
  };
  const initial = new Map();
  form.querySelectorAll('[data-qid]').forEach(node => initial.set(node.dataset.qid, readAnswer(node)));
  form.addEventListener('input', e => {
    const item = e.target.closest('[data-qid]');
    if (item) item.dataset.unsaved = String(JSON.stringify(readAnswer(item)) !== JSON.stringify(initial.get(item.dataset.qid)));
  });
  form.addEventListener('change', e => {
    const item = e.target.closest('[data-qid]');
    if (item) item.dataset.unsaved = String(JSON.stringify(readAnswer(item)) !== JSON.stringify(initial.get(item.dataset.qid)));
  });

  form.addEventListener('click', e => {
    const button = e.target.closest('[data-act="re-answer"]');
    if (!button) return;
    e.preventDefault();
    const qid = button.dataset.qid;
    const item = Array.from(form.querySelectorAll('[data-qid]')).find(node => node.dataset.qid === qid);
    const question = questions.find(q => q.id === qid);
    const answered = item?.querySelector('.q-answered');
    if (!question || !answered) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'q-input';
    const kind = question.type;
    const makeInput = (type, value) => {
      const input = document.createElement('input');
      input.type = type;
      input.value = value;
      input.name = 'q_' + qid;
      input.setAttribute('aria-labelledby', 'label-' + qid);
      return input;
    };
    if (kind === 'radio' || kind === 'checkbox') {
      for (const option of question.options || []) {
        const label = document.createElement('label');
        label.className = 'opt';
        const input = makeInput(kind, option);
        input.checked = kind === 'checkbox' ? (question.answer || []).includes(option) : question.answer === option;
        label.append(input, document.createTextNode(option));
        wrapper.append(label);
      }
    } else if (kind === 'select') {
      const select = document.createElement('select');
      select.setAttribute('aria-labelledby', 'label-' + qid);
      for (const option of ['', ...(question.options || [])]) {
        const element = document.createElement('option');
        element.value = option;
        element.textContent = option || '— 请选择 —';
        element.selected = question.answer === option;
        select.append(element);
      }
      wrapper.append(select);
    } else if (kind === 'multiline') {
      const textarea = document.createElement('textarea');
      textarea.value = question.answer || '';
      textarea.setAttribute('aria-labelledby', 'label-' + qid);
      wrapper.append(textarea);
    } else {
      wrapper.append(makeInput('text', question.answer || ''));
    }
    answered.replaceWith(wrapper);
    initial.set(qid, readAnswer(item));
    wrapper.querySelector('input, select, textarea')?.focus();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const answers = {};
    let error = '';
    form.querySelectorAll('[data-qid]').forEach(node => {
      const qid = node.dataset.qid;
      const answer = readAnswer(node);
      if (answer === undefined || JSON.stringify(answer) === JSON.stringify(initial.get(qid))) return;
      const question = questions.find(q => q.id === qid);
      if (question?.required && (answer === '' || Array.isArray(answer) && answer.length === 0)) {
        error = '请填写必填问题：' + question.question;
        return;
      }
      answers[qid] = answer;
    });
    if (error) { window.toast(error, 'err'); return; }
    if (Object.keys(answers).length === 0) {
      window.toast('没有需要保存的新答案');
      return;
    }
    const submit = form.querySelector('button[type=submit]');
    if (submit.disabled) return;
    submit.disabled = true;
    // Each answer becomes a separate draft action
    try {
      for (const [qid, ans] of Object.entries(answers)) {
        const r = await fetch(window.__SERVER__ + '/draft', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'form_answer',
            payload: { question_id: qid, answer: ans }
          })
        });
        if (r.ok) {
          initial.set(qid, ans);
          const node = Array.from(form.querySelectorAll('[data-qid]')).find(node => node.dataset.qid === qid);
          if (node) node.dataset.unsaved = 'false';
        }
        if (!r.ok) {
          const err = await r.text();
          window.toast('✗ 保存草稿失败: ' + err, 'err');
          return;
        }
      }
      window.toast('✓ 已存 ' + Object.keys(answers).length + ' 条草稿 · 顶部提交后 AI 处理');
      if (window.__refreshDraftCount) window.__refreshDraftCount();
    } catch (e) {
      window.toast('✗ sidecar 未运行，已输入的答案仍保留', 'err');
    } finally {
      submit.disabled = false;
    }
  });
});
</script>
