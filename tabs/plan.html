<!-- tab: plan -->
<style>
.plan-goal {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text);
  letter-spacing: -0.02em;
  margin: 0 0 4px;
}
.plan-context {
  font-size: 14px;
  color: var(--text-soft);
  line-height: 1.65;
  white-space: pre-wrap;
}
.kp-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.kp-list li {
  padding: 6px 0 6px 20px;
  position: relative;
  line-height: 1.55;
  font-size: 14px;
  border-bottom: 1px solid var(--border-soft);
}
.kp-list li:last-child { border-bottom: none; }
.kp-list li::before {
  content: "";
  position: absolute;
  left: 4px; top: 13px;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
}

/* Compact timeline steps */
.steps {
  position: relative;
  margin: 0;
  padding: 0;
  list-style: none;
}
.steps::before {
  content: "";
  position: absolute;
  top: 8px; bottom: 8px;
  left: 5px;
  width: 1px;
  background: var(--border);
}
.step {
  position: relative;
  padding: 0 0 16px 24px;
}
.step:last-child { padding-bottom: 0; }
.step::before {
  content: "";
  position: absolute;
  left: 0; top: 6px;
  width: 11px; height: 11px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 50%;
  z-index: 1;
}
.step.done::before        { background: var(--ok);     border-color: var(--ok); }
.step.in_progress::before { background: var(--accent); border-color: var(--accent); }
.step.blocked::before     { background: var(--err);    border-color: var(--err); }
.step-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.step-id {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}
.step-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
}
.step-notes {
  white-space: pre-wrap;
  color: var(--text-soft);
  font-size: 13px;
  line-height: 1.6;
}

/* Annotation list */
.annot-list { margin-top: 4px; }
.annot-list .group-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 14px 0 6px;
}
.annot-list .group-title:first-child { margin-top: 0; }
.annot-item {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 8px;
  transition: opacity 0.2s;
}
.annot-item.resolved { border-left: 2px solid var(--ok); }
.annot-item.orphan { border-left: 2px solid var(--warn); }
.annot-head {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 6px;
  font-size: 12px;
  color: var(--text-muted);
}
.annot-num {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--mark-border);
}
.annot-quote {
  font-size: 12px;
  color: var(--text-muted);
  border-left: 2px solid var(--mark-border);
  padding-left: 8px;
  margin-bottom: 6px;
}
.annot-body { white-space: pre-wrap; line-height: 1.55; font-size: 13px; }
.annot-body[contenteditable="true"] {
  background: var(--bg);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  outline: none;
}
.annot-row-actions {
  display: flex; gap: 4px; margin-top: 6px;
}
.annot-row-actions button { font-size: 12px; padding: 2px 6px; }
</style>

<section data-tab-id="{{TAB_ID}}" data-tab-type="plan" id="panel-{{TAB_ID}}">

  <div class="block">
    <h2 class="block-title">目标</h2>
    <div class="block-body">
      <div class="plan-goal field" data-ref-id="goal" data-field="text">{{PLAN_GOAL}}</div>
    </div>
  </div>

  <div class="block">
    <h2 class="block-title">背景</h2>
    <div class="block-body">
      <div class="plan-context field" data-ref-id="context" data-field="text">{{PLAN_CONTEXT}}</div>
    </div>
  </div>

  <div class="block">
    <h2 class="block-title">关键点</h2>
    <div class="block-body">
      <ul class="kp-list">{{PLAN_KEY_POINTS}}</ul>
    </div>
  </div>

  <div class="block">
    <h2 class="block-title">步骤</h2>
    <div class="block-body">
      <ol class="steps">{{PLAN_STEPS}}</ol>
    </div>
  </div>

  <div class="block">
    <h2 class="block-title">批注</h2>
    <div class="block-body">
      <div class="annot-list" id="annot-list">{{ANNOT_LIST}}</div>
    </div>
  </div>

</section>
